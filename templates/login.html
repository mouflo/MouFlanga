<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connexion · MouFlanga</title>
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
</head>
<body class="mou-login">
<div class="box">
    <h2 class="mou-title big">
        <span class="w">MouFl</span><span class="g">anga</span>
    </h2>
    <div class="sub">Connecte-toi pour accéder à tes mangas</div>

    <div id="error" class="error" style="display:none"></div>

    <label for="username">Identifiant</label>
    <input type="text" id="username" placeholder="admin" autocapitalize="off" spellcheck="false">

    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••">

    <button id="login-btn" onclick="doLogin()">Se connecter</button>

    <div class="ver">v{{ version }}</div>
</div>

<script>
async function doLogin() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (!username || !password) {
        showError('Veuillez remplir tous les champs');
        return;
    }

    try {
        const r = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });

        if (r.ok) {
            window.location.href = '/';
        } else {
            const data = await r.json();
            showError(data.error || 'Erreur connexion');
        }
    } catch (e) {
        showError('Erreur: ' + e.message);
    }
}

function showError(msg) {
    const err = document.getElementById('error');
    err.textContent = msg;
    err.style.display = 'block';
}

document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
