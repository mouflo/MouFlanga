<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Configuration · MouFlanga</title>
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
</head>
<body class="mou-login">
<div class="box">
    <h2 class="mou-title big">
        <span class="w">MouFl</span><span class="g">anga</span>
    </h2>
    <div class="sub">Configuration initiale</div>
    <div class="setup">
        <p>Bienvenue ! Crée un compte administrateur pour accéder à l'application.</p>
    </div>

    <div id="error" class="error" style="display:none"></div>

    <label for="username">Identifiant (admin)</label>
    <input type="text" id="username" placeholder="admin" value="admin" autocapitalize="off" spellcheck="false">

    <label for="password">Mot de passe (min. 6 caractères)</label>
    <input type="password" id="password" placeholder="••••••••">

    <label for="confirm">Confirmer le mot de passe</label>
    <input type="password" id="confirm" placeholder="••••••••">

    <button id="setup-btn" onclick="doSetup()">Créer le compte et continuer</button>

    <div class="ver">v{{ version }}</div>
</div>

<script>
async function doSetup() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (!username || !password || !confirm) {
        showError('Veuillez remplir tous les champs');
        return;
    }

    if (password !== confirm) {
        showError('Les mots de passe ne correspondent pas');
        return;
    }

    if (password.length < 6) {
        showError('Le mot de passe doit faire au moins 6 caractères');
        return;
    }

    try {
        const r = await fetch('/setup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });

        if (r.ok) {
            window.location.href = '/';
        } else {
            const data = await r.json();
            showError(data.error || 'Erreur configuration');
        }
    } catch (e) {
        showError('Erreur: ' + e.message);
    }
}

function showError(msg) {
    const err = document.getElementById('error');
    err.textContent = msg;
    err.style.display = 'block';
}

document.getElementById('confirm').addEventListener('keypress', e => {
    if (e.key === 'Enter') doSetup();
});
</script>
</body>
</html>
