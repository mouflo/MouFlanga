<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MouFlanga</title>
<link rel="icon" type="image/svg+xml" href="/icons/mouflanga.svg"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/icons/manifest.webmanifest"><meta name="theme-color" content="#121315">
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
<link rel="stylesheet" href="/ui/mouflanga.css?v={{ version|urlencode }}">
<script src="/ui/mou-ui.js?v={{ version|urlencode }}" defer></script>
<script src="/ui/mouflanga.js?v={{ version|urlencode }}" defer></script>
</head>
<body class="mou-skin">
<div class="container">
    <div id="mou-header" data-app="mouflanga" data-prefix="MouFl" data-rest="anga" data-version="{{ version }}" data-sub="Bibliothèque et lecteur de mangas" data-settings="1"></div>

    <div id="listView">
        <div style="margin-bottom: 16px;">
            <a href="/telecharger" class="mou-btn" style="display: inline-block; margin-right: 8px;">📥 Télécharger des mangas</a>
        </div>
        <a href="/importer" class="bandeau-import" id="bandeauImport" hidden></a>
        <div class="panel">
            <div class="toolbar">
                <input type="text" id="search" placeholder="🔍 Chercher une série…" autocomplete="off" spellcheck="false">
                <select id="sort" aria-label="Afficher">
                    <optgroup label="Toutes les séries">
                        <option value="title">Titre (A → Z)</option>
                        <option value="recent">Lues récemment</option>
                        <option value="added">Ajoutées récemment</option>
                    </optgroup>
                    <optgroup label="Ma lecture">
                        <option value="lecture">📖 En cours de lecture</option>
                        <option value="nonlu">🆕 Pas encore commencées</option>
                        <option value="lu">✔️ Déjà lues</option>
                    </optgroup>
                    <optgroup label="Parution">
                        <option value="fini">✅ Séries complètes (tout est là)</option>
                        <option value="incomplet">⚠ Terminées mais incomplètes</option>
                        <option value="parution">🔄 En cours de parution</option>
                    </optgroup>
                </select>
            </div>
            <div class="lettres" id="lettres" hidden></div>
            <div id="listMsg"></div>
            <div id="grid" class="grid"></div>
        </div>
    </div>

    <div id="seriesView" style="display:none">
        <a class="back" href="#" id="backList">← Toutes les séries</a>
        <div class="panel">
            <div class="series-head">
                <div class="cover-box">
                    <button class="cover-btn" id="sCoverBtn" aria-label="Changer la couverture" aria-haspopup="true"><img id="sCover" alt=""><span class="cover-edit">✏️</span></button>
                    <div class="menu" id="menuCover" hidden>
                        <button id="sCoverPick">🖼 Choisir une image</button>
                        <a id="sCoverMfs" hidden>🎨 Créer avec MouFloster</a>
                        <button id="sCoverAuto" hidden>↺ Couverture automatique</button>
                    </div>
                    <input type="file" id="sCoverFile" accept="image/*" hidden>
                </div>
                <div class="series-info">
                    <h2 id="sTitle"></h2>
                    <div class="meta" id="sMeta"></div>
                    <div class="etat-ligne" id="sEtat" hidden></div>
                    <a class="missing-line" id="sMissingLine" hidden title="Chercher les manquants sur Japscan"></a>
                    <div class="actions">
                        <button id="sResume">▶ Reprendre</button>
                        <div class="more-box">
                            <button class="ghost" id="sMore" aria-label="Plus d'actions" aria-haspopup="true">⋯</button>
                            <div class="menu menu-droite" id="menuMore" hidden>
                                <button id="sAllRead">✔ Tout marquer lu</button>
                                <button id="sAllUnread">↺ Tout marquer non lu</button>
                                <button id="sTomes" hidden>📚 Ranger en tomes</button>
                                <button id="sRenommer">✏️ Renommer la série</button>
                                <a id="sGenerique" hidden title="Ouvre MouFlopening sur l’anime de cette série">🎵 Choisir le générique</a>
                                <button class="danger" id="sDelete">🗑 Supprimer la série</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="resume" id="sPitch"><div class="resume-titre"><span class="resume-nom">📖 Synopsis</span><button class="resume-modif secondary" id="sEcouter" hidden title="Écouter le générique de l'anime" aria-label="Écouter le générique">🎵</button><button class="resume-modif secondary" id="sPitchModif" title="Modifier le synopsis" aria-label="Modifier le synopsis">✏️</button></div><div class="resume-texte" id="sPitchTexte" title="Appuie pour tout lire"></div>
                <div id="sPitchEdit" hidden><textarea id="sPitchZone" class="mou-field resume-zone" rows="8" maxlength="5000" placeholder="Écris le synopsis de la série…"></textarea>
                    <div class="actions resume-actions"><button id="sPitchOk">💾 Enregistrer</button><button class="secondary" id="sPitchAnnuler">Annuler</button><button class="secondary" id="sPitchAuto" title="Effacer ton texte et reprendre le synopsis trouvé sur Internet">↺ Automatique</button></div>
                    <div class="resume-aide">Pour copier un synopsis : <a id="sPitchNautiljon" target="_blank" rel="noopener">🔎 Nautiljon</a> (appui long sur le texte → Copier, puis colle-le ici).</div></div></div>
            <div class="progres" id="sProgres" hidden></div>
            <div class="organiser" id="sOrga" hidden>
                <div id="sOrgaTexte"></div>
                <label for="sOrgaNom">Nom de la série</label>
                <div class="actions"><input type="text" id="sOrgaNom" autocomplete="off" spellcheck="false"><button id="sOrgaGo">🧹 Organiser</button></div>
            </div>
            <div id="sMsg"></div>
            <div id="chapters" class="chapters"></div>
        </div>
    </div>
</div>
</body>
</html>
