<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MouFlanga</title>
<link rel="icon" type="image/svg+xml" href="/icons/mouflanga.svg"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/icons/manifest.webmanifest"><meta name="theme-color" content="#121315">
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
<link rel="stylesheet" href="/ui/mouflanga.css?v={{ version|urlencode }}">
<script src="/ui/mou-ui.js?v={{ version|urlencode }}" defer></script>
<script src="/ui/mouflanga.js?v={{ version|urlencode }}" defer></script>
</head>
<body class="mou-skin">
<div class="container">
    <div id="mou-header" data-app="mouflanga" data-prefix="MouFl" data-rest="anga" data-version="{{ version }}" data-sub="Bibliothèque et lecteur de mangas" data-settings="1"></div>

    <div id="listView">
        <div style="margin-bottom: 16px;">
            <a href="/telecharger" class="mou-btn" style="display: inline-block; margin-right: 8px;">📥 Télécharger des mangas</a>
        </div>
        <div class="panel">
            <div class="toolbar">
                <input type="text" id="search" placeholder="🔍 Chercher une série…" autocomplete="off" spellcheck="false">
                <select id="sort" aria-label="Trier">
                    <option value="recent">Lu récemment</option>
                    <option value="title">Titre (A → Z)</option>
                    <option value="added">Ajouté récemment</option>
                    <option value="unread">Plus de chapitres à lire</option>
                </select>
            </div>
            <div id="listMsg"></div>
            <div id="grid" class="grid"></div>
        </div>
    </div>

    <div id="seriesView" style="display:none">
        <a class="back" href="#" id="backList">← Toutes les séries</a>
        <div class="panel">
            <div class="series-head">
                <img id="sCover" alt="">
                <div class="series-info">
                    <h2 id="sTitle"></h2>
                    <div class="meta" id="sMeta"></div>
                    <div class="row">
                        <button id="sResume">▶ Reprendre</button>
                        <button class="ghost" id="sAllRead">✔ Tout marquer lu</button>
                        <button class="ghost" id="sAllUnread">↺ Tout marquer non lu</button>
                        <button class="ghost danger" id="sDelete">🗑 Supprimer la série</button>
                    </div>
                </div>
            </div>
            <div id="sMsg"></div>
            <div id="chapters" class="chapters"></div>
        </div>
    </div>
</div>
</body>
</html>
